name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Unicode smoke test
        run: python smoke_test.py

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SQLite-to-XLSX app.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SQLite-to-XLSX.exe")) { throw "EXE was not created" }
          Get-Item "dist/SQLite-to-XLSX.exe" | Format-List Name,Length,FullName

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SQLite-to-XLSX-Windows
          path: dist/SQLite-to-XLSX.exe
          if-no-files-found: error
          retention-days: 7
