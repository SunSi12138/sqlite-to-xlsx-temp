name: Build AutoVocal Prototype Windows

on:
  push:
    branches:
      - prototype/reference-vocal-autotune
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py audio_core.py

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name AutoVocal-Prototype `
            --collect-all parselmouth `
            --collect-all scipy `
            app.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/AutoVocal-Prototype.exe")) { throw "EXE was not created" }
          Get-Item "dist/AutoVocal-Prototype.exe" | Format-List Name,Length,FullName

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: AutoVocal-Prototype-Windows
          path: dist/AutoVocal-Prototype.exe
          if-no-files-found: error
          retention-days: 14
